name: "Continuous Deployment (CD)"

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # ─── 1. BUILD & PUBLISH DOCKER IMAGES TO GHCR ────────────────────────────────
  build-and-push:
    name: Build & Push Container Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels) for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/oculide-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & Push Backend API Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata for Celery Worker
        id: meta-celery
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/oculide-celery
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & Push Celery Proctoring Worker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.celery
          push: true
          tags: ${{ steps.meta-celery.outputs.tags }}
          labels: ${{ steps.meta-celery.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 2. DEPLOYMENT TRIGGER TO SERVER ─────────────────────────────────────────
  deploy-to-server:
    name: Trigger Production Deployment
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH (If Secrets Configured)
        env:
          SSH_HOST: ${{ secrets.PROD_SERVER_HOST }}
          SSH_USER: ${{ secrets.PROD_SERVER_USER }}
          SSH_KEY: ${{ secrets.PROD_SERVER_SSH_KEY }}
        run: |
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_KEY" ]; then
            echo "🚀 Đang triển khai tự động lên máy chủ $SSH_HOST..."
            # Cấu hình SSH và kéo image mới:
            # ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "cd /app/oculide-v1 && docker compose pull && docker compose up -d"
            echo "✅ Triển khai thành công!"
          else
            echo "ℹ️ Chưa cấu hình PROD_SERVER_HOST / SSH Secrets. Bỏ qua bước SSH Deploy."
            echo "Docker Images mới nhất đã sẵn sàng tại GHCR để kéo về máy chủ bất kỳ lúc nào."
          fi

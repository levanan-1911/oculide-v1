components:
  schemas:
    AdminUserCreateRequest:
      properties:
        username:
          type: string
          maxLength: 50
          minLength: 3
          title: Username
        password:
          type: string
          minLength: 6
          title: Password
        email:
          type: string
          format: email
          title: Email
        full_name:
          type: string
          maxLength: 100
          minLength: 2
          title: Full Name
        role:
          type: string
          pattern: ^(admin|instructor|student)$
          title: Role
        student_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Student Id
        is_active:
          type: boolean
          title: Is Active
          default: true
      type: object
      required:
      - username
      - password
      - email
      - full_name
      - role
      title: AdminUserCreateRequest
    AdminUserRoleUpdate:
      properties:
        role:
          type: string
          pattern: ^(admin|instructor|student)$
          title: Role
      type: object
      required:
      - role
      title: AdminUserRoleUpdate
    AdminUserStatusUpdate:
      properties:
        is_active:

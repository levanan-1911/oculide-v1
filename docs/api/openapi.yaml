openapi: 3.1.0
info:
  title: Oculide Core API
  description: Backend Core API cho hệ thống Oculide v1 (IEEE 830 Specification)
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health Check
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health/liveness:
    get:
      tags:
      - Health
      summary: Health Liveness
      description: 'Liveness probe: Xác nhận tiến trình Web Server không bị treo/deadlock'
      operationId: health_liveness_health_liveness_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health/readiness:
    get:
      tags:
      - Health
      summary: Health Readiness
      description: 'Readiness probe: Kiểm tra kết nối CSDL để sẵn sàng nhận request
        từ Reverse Proxy/Load Balancer'
      operationId: health_readiness_health_readiness_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register
      description: Đăng ký tài khoản người dùng mới (Instructor / Student)
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Login
      description: Đăng nhập hệ thống bằng username/email và password nhận cặp Access
        + Refresh JWT token
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh Access Token
      description: Làm mới Access Token khi token cũ đã hết hạn bằng Refresh Token
      operationId: refresh_access_token_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - Authentication
      summary: Get My Profile
      description: Lấy thông tin tài khoản hiện tại
      operationId: get_my_profile_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/auth/join:
    post:
      tags:
      - Authentication
      summary: Join Room Fast
      description: Sinh viên tham gia phòng nhanh bằng room_code và passcode (Tạo
        tài khoản khách duy nhất an toàn)
      operationId: join_room_fast_api_v1_auth_join_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRoomRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login/google:
    get:
      tags:
      - Authentication
      summary: Login Google
      description: Khởi tạo URL đăng nhập qua Google OAuth2
      operationId: login_google_api_v1_auth_login_google_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/auth/callback/google:
    get:
      tags:
      - Authentication
      summary: Callback Google
      description: Tiếp nhận mã xác thực từ Google OAuth2 và trả JWT token
      operationId: callback_google_api_v1_auth_callback_google_get
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          title: Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login/github:
    get:
      tags:
      - Authentication
      summary: Login Github
      description: Khởi tạo URL đăng nhập qua GitHub OAuth
      operationId: login_github_api_v1_auth_login_github_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/auth/callback/github:
    get:
      tags:
      - Authentication
      summary: Callback Github
      description: Tiếp nhận mã xác thực từ GitHub OAuth
      operationId: callback_github_api_v1_auth_callback_github_get
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          title: Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/profile:
    put:
      tags:
      - Authentication
      summary: Update Profile
      description: Cập nhật thông tin tài khoản cá nhân
      operationId: update_profile_api_v1_auth_profile_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/auth/change-password:
    put:
      tags:
      - Authentication
      summary: Change Password
      description: Đổi mật khẩu người dùng
      operationId: change_password_api_v1_auth_change_password_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/admin/users:
    get:
      tags:
      - Admin Management
      summary: List Users
      description: Lấy danh sách người dùng hệ thống có tìm kiếm và phân trang
      operationId: list_users_api_v1_admin_users_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      - name: role
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsersResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Admin Management
      summary: Create User By Admin
      description: Admin tạo tài khoản người dùng mới
      operationId: create_user_by_admin_api_v1_admin_users_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/users/{user_id}:
    get:
      tags:
      - Admin Management
      summary: Get User Details
      description: Xem thông tin chi tiết người dùng
      operationId: get_user_details_api_v1_admin_users__user_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Admin Management
      summary: Remove User
      description: Xóa tài khoản người dùng khỏi hệ thống
      operationId: remove_user_api_v1_admin_users__user_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/users/{user_id}/status:
    put:
      tags:
      - Admin Management
      summary: Toggle User Status
      description: Kích hoạt hoặc vô hiệu hóa tài khoản người dùng
      operationId: toggle_user_status_api_v1_admin_users__user_id__status_put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserStatusUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/users/{user_id}/role:
    put:
      tags:
      - Admin Management
      summary: Change User Role
      description: Cập nhật quyền vai trò người dùng (admin, instructor, student)
      operationId: change_user_role_api_v1_admin_users__user_id__role_put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRoleUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/users/{user_id}/reset-password:
    post:
      tags:
      - Admin Management
      summary: Reset User Password
      description: Đặt lại mật khẩu người dùng về mật khẩu ngẫu nhiên
      operationId: reset_user_password_api_v1_admin_users__user_id__reset_password_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/users/batch-import:
    post:
      tags:
      - Admin Management
      summary: Batch Import Users
      description: Nhập danh sách tài khoản theo lô
      operationId: batch_import_users_api_v1_admin_users_batch_import_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchImportRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchImportResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/admin/system/overview:
    get:
      tags:
      - Admin Management
      summary: System Overview
      description: Lấy số liệu thống kê tổng quan hệ thống cho Admin
      operationId: system_overview_api_v1_admin_system_overview_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
  /api/v1/admin/logs:
    get:
      tags:
      - Admin Management
      summary: List System Logs
      description: Lấy danh sách nhật ký kiểm toán hệ thống từ bảng SystemLogs
      operationId: list_system_logs_api_v1_admin_logs_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Page Size
      - name: log_level
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Log Level
      - name: module
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Module
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/rooms:
    post:
      tags:
      - Rooms
      summary: Create New Room
      description: Tạo phòng thi hoặc phòng thực hành mới
      operationId: create_new_room_api_v1_rooms_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Rooms
      summary: List Rooms
      description: Lấy danh sách các phòng khả dụng
      operationId: list_rooms_api_v1_rooms_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: room_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Room Type
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomResponse'
                title: Response List Rooms Api V1 Rooms Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/rooms/public/{room_code}:
    get:
      tags:
      - Rooms
      summary: Get Public Room Info
      description: Lấy thông tin công khai của phòng thi trước khi đăng nhập hoặc
        nhập passcode
      operationId: get_public_room_info_api_v1_rooms_public__room_code__get
      parameters:
      - name: room_code
        in: path
        required: true
        schema:
          type: string
          title: Room Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRoomResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/rooms/{room_id}:
    get:
      tags:
      - Rooms
      summary: Get Room Details
      description: Xem cấu hình chi tiết của phòng
      operationId: get_room_details_api_v1_rooms__room_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Rooms
      summary: Update Room Details
      description: Chỉnh sửa cấu hình phòng
      operationId: update_room_details_api_v1_rooms__room_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Rooms
      summary: Remove Room
      description: Xóa phòng thi
      operationId: remove_room_api_v1_rooms__room_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/rooms/{room_id}/dashboard:
    get:
      tags:
      - Rooms
      summary: Get Room Dashboard
      description: Dữ liệu Panoptic Grid View tổng hợp giám sát phòng thi thời gian
        thực (Zero N+1 query)
      operationId: get_room_dashboard_api_v1_rooms__room_id__dashboard_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDashboardResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/rooms/{room_id}/scoreboard:
    get:
      tags:
      - Rooms
      summary: Get Scoreboard
      description: Bảng điểm thời gian thực tổng hợp kết quả của sinh viên trong phòng
      operationId: get_scoreboard_api_v1_rooms__room_id__scoreboard_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/rooms/{room_id}/config:
    get:
      tags:
      - Rooms
      summary: Get Room Config
      description: Lấy cấu hình runtime môi trường phòng (danh sách ngôn ngữ, giới
        hạn sandbox)
      operationId: get_room_config_api_v1_rooms__room_id__config_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/rooms/{room_id}/enrollments:
    get:
      tags:
      - Rooms
      summary: List Room Enrollments
      description: Lấy danh sách sinh viên ghi danh trong phòng
      operationId: list_room_enrollments_api_v1_rooms__room_id__enrollments_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:

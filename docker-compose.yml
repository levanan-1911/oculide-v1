services:

  # ─── SQL Server ───────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: exam-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${MSSQL_SA_PASSWORD:-123456}"
      MSSQL_MEMORY_LIMIT_MB: 512
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./database/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./database/schema.sql:/schema.sql:ro
      - ./database/sample_data.sql:/sample_data.sql:ro
      - ./database/reset_db.sql:/reset_db.sql:ro
    entrypoint:
      - "/bin/bash"
      - "-c"
      - "bash /docker-entrypoint-initdb.d/init-db.sh & /opt/mssql/bin/sqlservr"
    networks:
      - exam-network
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S",
          "localhost",
          "-U",
          "sa",
          "-P",
          "${MSSQL_SA_PASSWORD:-123456}",
          "-No",
          "-Q",
          "SELECT 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ─── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: exam-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - exam-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

  # ─── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exam-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_SERVER: sqlserver
      DATABASE_NAME: ExamSystem
      DATABASE_USERNAME: sa
      DATABASE_PASSWORD: "${MSSQL_SA_PASSWORD:-123456}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LIVEKIT_URL: wss://oculide-exam-4eu7af2s.livekit.cloud
      LIVEKIT_API_KEY: APIYsZcXomYALVS
      LIVEKIT_API_SECRET: H1lgQ7E9lv8f7G5g7DaaAD70Svg4qn7JvEPmFWjXcqV
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-oculide-secret-key-change-in-production-2026}"
      DOCKER_HOST: "unix:///var/run/docker.sock"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,https://oculide.id.vn,https://api.oculide.id.vn}"
      FRONTEND_URL: "${FRONTEND_URL:-https://oculide.id.vn}"
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-oculide.system@gmail.com}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-zrljvmnyvrkxsjlc}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Hệ thống Khảo thí Oculide}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-oculide.system@gmail.com}"
      SMTP_TLS: "${SMTP_TLS:-True}"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - exam-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ─── Celery Worker — Code Grading ────────────────────────────────────────────
  celery-grading:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exam-celery-grading
    restart: unless-stopped
    command: celery -A celery_app worker -B -Q grading,maintenance,default --loglevel=info --concurrency=2 --max-memory-per-child=300000 --max-tasks-per-child=500
    environment:
      DATABASE_SERVER: sqlserver
      DATABASE_NAME: ExamSystem
      DATABASE_USERNAME: sa
      DATABASE_PASSWORD: "${MSSQL_SA_PASSWORD:-123456}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SANDBOX_MEM_LIMIT: "128m"
      SANDBOX_TIME_LIMIT_S: "10"
      SANDBOX_NANO_CPUS: "500000000"
      DOCKER_HOST: "unix:///var/run/docker.sock"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - exam-network

  # ─── Celery Worker — AI Proctoring ───────────────────────────────────────────
  celery-proctoring:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: exam-celery-proctoring
    restart: unless-stopped
    command: celery -A celery_app worker -Q proctoring --loglevel=info --concurrency=2 --max-memory-per-child=400000 --max-tasks-per-child=200
    environment:
      DATABASE_SERVER: sqlserver
      DATABASE_NAME: ExamSystem
      DATABASE_USERNAME: sa
      DATABASE_PASSWORD: "${MSSQL_SA_PASSWORD:-123456}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./ai_workers:/app/ai_workers
      - yolo_weights:/root/.config/ultralytics
    networks:
      - exam-network

  # ─── Frontend Next.js Web App ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-https://api.oculide.id.vn}"
        NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-wss://api.oculide.id.vn}"
        NEXT_PUBLIC_LIVEKIT_URL: "${NEXT_PUBLIC_LIVEKIT_URL:-wss://oculide-exam-4eu7af2s.livekit.cloud}"
    container_name: exam-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-https://api.oculide.id.vn}"
      NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-wss://api.oculide.id.vn}"
      NEXT_PUBLIC_LIVEKIT_URL: "${NEXT_PUBLIC_LIVEKIT_URL:-wss://oculide-exam-4eu7af2s.livekit.cloud}"
      BACKEND_INTERNAL_URL: "http://backend:8000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - exam-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  sqlserver_data:
  redis_data:
  yolo_weights:

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  exam-network:
    driver: bridge
